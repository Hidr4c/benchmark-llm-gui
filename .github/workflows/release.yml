name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: benchmark-llm-gui-windows-x64.zip
            asset_path: benchmark-llm-gui-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: benchmark-llm-gui-linux-x64.tar.gz
            asset_path: benchmark-llm-gui-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: benchmark-llm-gui-macos-arm64.tar.gz
            asset_path: benchmark-llm-gui-macos-arm64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libspeechd-dev libxkbcommon-dev libssl-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/benchmark-llm-gui.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Unix Artifact
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }} benchmark-llm-gui

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
